name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and capture log
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug > build-log.txt 2>&1
          STATUS=$?
          cat build-log.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Save latest failure log
        if: failure()
        run: |
          mkdir -p ci
          {
            echo "PantryPilot latest CI failure log"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat build-log.txt
          } > ci/latest-build-log.txt

      - name: Commit latest failure log
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update latest CI failure log"
          file_pattern: ci/latest-build-log.txt
